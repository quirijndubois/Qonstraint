[package]
name = "physics_sim"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = { version = "0.30", default-features = false }
web-time = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
base64 = "0.23.1"
miniz_oxide = "0.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"
egui-winit = "0.30" # default features (clipboard, links, x11, wayland) on native only

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "23", features = ["webgl"] } # WebGL2 fallback where WebGPU is missing
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Navigator", "Clipboard", "Storage"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

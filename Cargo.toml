[package]
name = "physics_sim"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

# A library too: Android loads the app as a shared library (`android_main`
# in lib.rs); desktop and web use the thin binary in main.rs.
[lib]
name = "qonstraint"
crate-type = ["cdylib", "rlib"]
doctest = false # code blocks in doc comments are illustrations

[dependencies]
winit = "0.30"
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = { version = "0.30", default-features = false }
web-time = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
base64 = "0.23.1"
miniz_oxide = "0.9.1"
log = "0.4"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
pollster = "0.3"
egui-winit = "0.30" # default features (clipboard, links, x11, wayland) on desktop only

[target.'cfg(target_os = "android")'.dependencies]
pollster = "0.3"
winit = { version = "0.30", features = ["android-native-activity"] }
egui-winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android_logger = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "23", features = ["webgl"] } # WebGL2 fallback where WebGPU is missing
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Navigator", "Clipboard", "Storage"] }
console_error_panic_hook = "0.1"
console_log = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Android app (`cargo apk build` / `cargo apk run`, see android.sh).
[package.metadata.android]
package = "app.qonstraint"
apk_name = "qonstraint"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Qonstraint"

# Handle rotation and resizes in place instead of Android restarting the app
# (which would throw the running scene away).
[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Qonstraint</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050506; }
    /* touch-action: the app handles pans and pinches itself; without it the
       browser scrolls and zooms the page instead. */
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

    /* Loading screen: shown until the wasm app has its GPU device (lib.rs
       adds `done` then), styled like the HUD panels. */
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 800;
      src: url("JetBrainsMono-ExtraBold.ttf") format("truetype");
      font-display: swap;
    }
    #loading {
      position: fixed; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      background: #050506;
      transition: opacity 0.3s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .panel {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 22px 34px 20px;
      background: #000; border: 1.5px solid #fff;
      font: 800 13px "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.06em; text-transform: uppercase; color: #fff;
    }
    #loading .title { font-size: 18px; }
    #loading .status { color: #828282; }
    #loading .status::after { content: "_"; animation: blink 1s steps(1) infinite; }
    #loading .arm { transform-origin: 40px 14px; animation: swing 1.6s ease-in-out infinite alternate; }
    @keyframes swing { from { transform: rotate(-32deg); } to { transform: rotate(32deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #loading .arm { animation: none; } }
  </style>
  <link data-trunk rel="copy-file" href="assets/fonts/JetBrainsMono-ExtraBold.ttf" />
  <link data-trunk rel="rust" data-bin="physics_sim" data-wasm-opt="z" />
</head>
<body>
  <div id="loading">
    <div class="panel">
      <div class="title">Qonstraint</div>
      <svg width="80" height="76" viewBox="0 0 80 76" aria-hidden="true">
        <!-- ceiling pedestal -->
        <rect x="26" y="2" width="28" height="4" fill="#fff" />
        <path d="M33 6 L47 6 L43 14 L37 14 Z" fill="#fff" />
        <g class="arm">
          <line x1="40" y1="14" x2="40" y2="58" stroke="#050506" stroke-width="7" stroke-linecap="round" />
          <line x1="40" y1="14" x2="40" y2="58" stroke="#fff" stroke-width="4" stroke-linecap="round" />
          <circle cx="40" cy="60" r="12" fill="#050506" />
          <circle cx="40" cy="60" r="10.5" fill="#fff" />
          <circle cx="40" cy="60" r="2.2" fill="#050506" />
        </g>
        <circle cx="40" cy="14" r="3.2" fill="#fff" stroke="#050506" stroke-width="1.5" />
        <circle cx="40" cy="14" r="1.1" fill="#050506" />
      </svg>
      <div class="status">Loading</div>
    </div>
  </div>
</body>
</html>
